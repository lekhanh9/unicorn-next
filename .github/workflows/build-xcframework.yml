name: Build Unicorn XCFramework

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xcframework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcframework:
    name: Build Unicorn XCFramework
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Install Build Dependencies
        run: |
          which cmake || brew install cmake
          which ninja || brew install ninja || true

      - name: Setup Xcode Environment
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version || true
          xcrun -sdk macosx --show-sdk-path || true
          xcrun -sdk iphoneos --show-sdk-path || true
          xcrun -sdk iphonesimulator --show-sdk-path || true

      - name: Build XCFramework
        env:
          UNICORN_LOGGING: "ON"
        run: |
          chmod +x build_xcframework.sh
          set +e
          bash -x ./build_xcframework.sh 2>&1 | tee build-xcframework.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            trace=$(tail -n 40 build-xcframework.log | tr '\n' ' ' | sed 's/%/%25/g; s/::/%3A%3A/g')
            echo "::error title=XCFramework build trace::$trace"
          fi
          exit "$status"

      - name: Package XCFramework Bundle
        shell: bash
        run: |
          cd build
          zip -r ../Unicorn.xcframework.zip Unicorn.xcframework
          cd ..
          CHECKSUM=$(shasum -a 256 Unicorn.xcframework.zip | awk '{print $1}')
          echo "CHECKSUM=$CHECKSUM" | tee -a $GITHUB_ENV
          echo "SHA256 Checksum: $CHECKSUM"

      - name: Upload XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unicorn.xcframework.zip
          path: Unicorn.xcframework.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 2.1.4-local
          name: "Unicorn XCFramework 2.1.4 (Local)"
          body: |
            Pre-compiled multiarch Unicorn.xcframework for macOS, iOS, iOS Simulator, tvOS.
            SHA256: `${{ env.CHECKSUM }}`
          files: Unicorn.xcframework.zip
