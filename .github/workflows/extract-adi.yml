name: xcode

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ipsw via Homebrew
        run: |
          brew install blacktop/tap/ipsw

      - name: Extract ADI binaries from dyld_shared_cache and filesystem
        run: |
          mkdir -p extracted

          echo "=== CLI Help ==="
          ipsw dyld --help || true
          ipsw dyld extract --help || true

          # 1. Search filesystem for standalone dylibs / frameworks
          echo "=== Searching filesystem for standalone ADI files ==="
          find /usr/lib /System/Library/PrivateFrameworks /System/Volumes/Preboot/Cryptexes/OS -name "*libadi*" -o -name "*CoreADI*" 2>/dev/null | while read -r f; do
            if [ -f "$f" ]; then
              echo "Found standalone file: $f"
              cp -v "$f" extracted/ || true
            fi
          done

          # 2. Search /Applications/Xcode.app
          if [ -d "/Applications/Xcode.app" ]; then
            echo "=== Searching /Applications/Xcode.app ==="
            find /Applications/Xcode.app -iname "*adi*" 2>/dev/null | while read -r f; do
              if [ -f "$f" ]; then
                echo "Found in Xcode: $f"
                cp -v "$f" extracted/ 2>/dev/null || true
              fi
            done
          fi

          # 3. Locate and extract from dyld_shared_cache
          echo "=== Locating dyld_shared_cache files ==="
          CACHES=()
          PRESETS=(
            "/System/Library/dyld/dyld_shared_cache_arm64e"
            "/System/Volumes/Preboot/Cryptexes/OS/System/Library/dyld/dyld_shared_cache_arm64e"
            "/System/Library/dyld/dyld_shared_cache_x86_64"
          )
          for p in "${PRESETS[@]}"; do
            if [ -f "$p" ]; then
              CACHES+=("$p")
            fi
          done

          FOUND_CACHES=$(find /System/Library/dyld /System/Volumes/Preboot/Cryptexes/OS/System/Library/dyld -name "dyld_shared_cache_*" 2>/dev/null | grep -vE "\.(symbols|atlas|map)$" || true)
          for f in $FOUND_CACHES; do
            if [ -f "$f" ]; then
              if [[ ! " ${CACHES[*]} " =~ " ${f} " ]]; then
                CACHES+=("$f")
              fi
            fi
          done

          echo "Found valid cache files:"
          for cache in "${CACHES[@]}"; do
            echo " - $cache"
          done

          for cache in "${CACHES[@]}"; do
            echo "=== Extracting from $cache ==="
            ipsw dyld extract "$cache" ".*CoreADI.*" -o extracted || true
            ipsw dyld extract "$cache" ".*libadi.*" -o extracted || true
            ipsw dyld extract "$cache" ".*AppleDeviceIdentity.*" -o extracted || true
            ipsw dyld extract "$cache" --dylib ".*CoreADI.*" -o extracted || true
            ipsw dyld extract "$cache" --dylib ".*libadi.*" -o extracted || true
            ipsw dyld extract "$cache" --dylib ".*AppleDeviceIdentity.*" -o extracted || true
          done

          # 4. Flatten extracted directory if ipsw created subdirectories
          find extracted -mindepth 2 -type f -exec cp -v {} extracted/ \; 2>/dev/null || true

      - name: Inspect extracted binaries
        run: |
          echo "=== Files in extracted/ ==="
          ls -la extracted/
          for bin in extracted/*; do
            if [ -f "$bin" ]; then
              echo "----------------------------------------"
              echo "File: $bin"
              file "$bin" || true
              echo "Dependencies (otool -L):"
              otool -L "$bin" || true
              echo "Exported symbols (nm -gU):"
              nm -gU "$bin" 2>/dev/null | head -n 50 || true
            fi
          done

      - name: Upload ADI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adi-binaries-macos-latest
          path: extracted/
          if-no-files-found: warn
